[package]
name = "t7-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
t7-proto.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }
winit = "0.30"
softbuffer = "0.4"
bytemuck = "1"
# CPU rasterizer for egui: egui_software_backend 0.0.3 ported to egui 0.37.
# Pinned exactly; the port's diff against upstream was reviewed.
egui_software_backend = { package = "hdrshot-egui-backend", version = "=0.2.0" }
toml = "1"
hound = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = "3"
ed25519-dalek = "3"
getrandom = "0.3"
sha2 = "0.11"
serde_json = "1"
cpal = "0.18"
opus1 = "0.3"
sonora = "=0.3.0"
nnnoiseless = { version = "=0.5.2", default-features = false }

[dev-dependencies]
png = "0.18"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# The same version cpal already pulls in, so this only adds features.
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
