[package]
name = "t7-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
t7-proto.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "wayland", "x11"] }
winit = "0.30"
softbuffer = "0.4"
bytemuck = "1"
# CPU rasterizer for egui: egui_software_backend 0.0.3 ported to egui 0.37.
# Pinned exactly; the port's diff against upstream was reviewed.
egui_software_backend = { package = "hdrshot-egui-backend", version = "=0.2.0" }
toml = "1"
hound = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = "3"
ed25519-dalek = "3"
sha2 = "0.11"
serde_json = "1"
cpal = "0.18"
opus1 = "0.3"
sonora = "=0.3.0"
nnnoiseless = { version = "=0.5.2", default-features = false }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
