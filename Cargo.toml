[workspace]
resolver = "3"
members = ["crates/proto", "crates/server", "crates/client", "crates/release"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
t7-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Self-signed server certificates, on ring like the rest of the TLS stack.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Strict by default: clippy's pedantic group on top of the defaults, minus the
# lints that fight this codebase (sample math casts on purpose, egui UI code
# is long, binaries have no public API to document).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
implicit_hasher = "allow"
maybe_infinite_iter = "allow"
needless_pass_by_value = "allow"
dbg_macro = "warn"
todo = "warn"
