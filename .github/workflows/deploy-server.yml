name: Deploy released server

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-released-server
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance Coolify to the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          git check-ref-format "refs/tags/$tag"
          commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git push origin "$commit:refs/heads/deploy/t7-server"
          echo "Server release: $tag ($commit)" >> "$GITHUB_STEP_SUMMARY"
