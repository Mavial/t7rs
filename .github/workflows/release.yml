# Builds, signs and publishes the T7 client when a version tag is pushed:
#
#   1. bump `version` in Cargo.toml, commit
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Installed clients find the release through latest.json and update themselves.
# Needs the T7_SIGNING_KEY secret (see crates/release) and, optionally, the
# T7_DEFAULT_SERVER variable (address prefilled for first-time users).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            binary: t7-client.exe
            asset: t7-windows-x86_64.exe
          - os: ubuntu-latest
            target: linux-x86_64
            binary: t7-client
            asset: t7-linux-x86_64
          - os: macos-latest
            target: macos-aarch64
            binary: t7-client
            asset: t7-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Build
        run: cargo build --release --locked -p t7-client
        env:
          T7_RELEASE: "1"
          T7_DEFAULT_SERVER: ${{ vars.T7_DEFAULT_SERVER }}
      - name: Rename
        shell: bash
        run: mv "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign and write latest.json
        env:
          T7_SIGNING_KEY: ${{ secrets.T7_SIGNING_KEY }}
        run: |
          cargo run --release --locked -p t7-release -- manifest \
            --version "${GITHUB_REF_NAME#v}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" \
            --out dist/latest.json \
            windows-x86_64=dist/t7-windows-x86_64.exe \
            linux-x86_64=dist/t7-linux-x86_64 \
            macos-aarch64=dist/t7-macos-aarch64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "T7 $GITHUB_REF_NAME" --generate-notes
